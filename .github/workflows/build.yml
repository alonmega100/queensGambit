name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: Build APK with Buildozer (verbose)
        run: |
          buildozer -v android debug 2>&1 | tee buildozer_full.log
        continue-on-error: true

      - name: Extract error summary
        if: always()
        run: |
          echo "=== LAST 200 LINES OF BUILD LOG ===" > build_summary.txt
          tail -200 buildozer_full.log >> build_summary.txt 2>/dev/null || echo "No log found" >> build_summary.txt
          echo ""
          echo "=== ERRORS AND EXCEPTIONS ===" >> build_summary.txt
          grep -i -E "(error|exception|traceback|failed|fatal)" buildozer_full.log >> build_summary.txt 2>/dev/null || echo "No errors found in grep" >> build_summary.txt
          cat build_summary.txt

      - name: Upload full build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: |
            buildozer_full.log
            build_summary.txt
          if-no-files-found: warn

      - name: Upload APK if build succeeded
        uses: actions/upload-artifact@v4
        with:
          name: QueensGambit-APK
          path: bin/*.apk
          if-no-files-found: warn
